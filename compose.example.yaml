# Template, not the deployed file. Copy to compose.yaml — which is gitignored — and
# adapt it there: the real deployment needs networks, proxy labels and paths that
# describe the server rather than the app, and none of that belongs in a repository
# whose database holds guest data.
#
# Deployment unit: one container, one volume, no dependencies. Compose reads the
# variables below from a .env file sitting next to it — on the server that file
# holds the production values, in a dev checkout it holds the local ones. The app
# itself never parses .env; it only ever sees the environment set here.
#
# The `:?` guards fail `docker compose up` before the container starts. That is
# earlier and louder than the app's own startup validation, which would otherwise
# report the same problem one restart loop later.

services:
  wedding:
    image: ${WEDDING_IMAGE:-server-andreas.local:5000/wedding:latest}
    # Present so `docker compose build` works from a checkout; on the server the
    # image comes from the registry and this is never used.
    build:
      context: .
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER:?ADMIN_USER is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The reverse proxy terminates TLS, so the cookie must still be marked Secure
      # even though this process speaks plain HTTP.
      SESSION_COOKIE_SECURE: "true"
      # Networks whose X-Forwarded-For is believed. Must cover the proxy, or every
      # request looks like it comes from the Docker bridge and the login rate limit
      # becomes global.
      # `?` and not `:?`: empty is a real, meaningful value here — trust nobody, use
      # the peer address — so only an entirely absent variable is an error.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS?TRUSTED_PROXY_CIDRS must be set, empty means trust no proxy}
    ports:
      # Loopback only: the reverse proxy is the sole way in. Publishing on 0.0.0.0
      # would expose the app on the server's LAN address, bypassing TLS entirely.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    volumes:
      # One volume for all durable state — that is what makes the backup story "copy
      # one directory" (and, for the database, `VACUUM INTO` rather than cp: the WAL
      # makes a raw copy of a live file unusable).
      - wedding-data:/data

volumes:
  wedding-data:
